<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <title>trivia time!</title>
  </head>
  <body>
    <div id="page-div">
      <div id="background-div"></div>
      <div id="logo"></div>
      <div id="main-div" class="border">
        <div id="timer"></div>
        <div id="setup">
          <p>Modify your Quiz!</p>
          <form action="#" id="options-form">
            <label for="number">Number of questions (max 50):</label>
            <input type="number" id="number" name="number" min="1" max="50" value="10" />
            <label for="category">Category:</label>
            <select name="category" id="category">
              <option value="any">Any Category</option>
              <option value="9">General Knowledge</option>
              <option value="18">Science: Computers</option>
              <option value="28">Vehicles</option>
            </select>
            <label for="difficulty">Difficulty:</label>
            <select name="difficulty" id="difficulty">
              <option value="any">Any Difficulty</option>
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
            <label for="type">Type:</label>
            <select name="type" id="type">
              <option value="any">Any Type</option>
              <option value="multiple">Multiple Choice</option>
              <option value="boolean">True / False</option>
            </select>
            <input type="submit" id="submit" class="main-btn" value="START QUIZ" /> 
          </form>
        </div>
        <div id="questions"></div>
        <div id="answers"></div>
        <div id="start-restart"></div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
